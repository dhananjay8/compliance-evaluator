[project]
name = "compliance-evaluator"
version = "0.1.0"
description = "LangGraph + Elasticsearch + local-LLM compliance policy evaluation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "langgraph>=0.2.60",
  "elasticsearch[async]>=8.15.0,<9.0.0",
  "pymupdf>=1.24.10",
  "httpx>=0.27.0",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "aiofiles>=24.1.0",
]

[project.optional-dependencies]
# Optional local embedding backend (heavy: pulls torch). Default path uses Ollama embeddings.
st = ["sentence-transformers>=3.0.0"]
fixtures = ["fpdf2>=2.7.9"]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-mock>=3.14.0",
  "respx>=0.21.1",
  "fpdf2>=2.7.9",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: tests requiring running Elasticsearch/Ollama (env-gated)",
  "e2e: full pipeline tests requiring running services",
]

[tool.ruff]
line-length = 110
target-version = "py312"
